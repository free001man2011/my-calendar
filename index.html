<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Calendar</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e3a8a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f4f6fb;color:#1f2937}
header{background:#1e3a8a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}#today{font-size:14px;opacity:.9}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr;padding:10px}}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;padding:14px}
.card h2{margin:0 0 10px;font-size:16px;color:#1e3a8a}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.nav button,button.p{background:#1e3a8a;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button{background:#e5e7eb;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:4px;font-size:14px}.tabs button.on{background:#1e3a8a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:#6b7280;font-weight:600}
.day{min-height:78px;border:1px solid #e5e7eb;border-radius:8px;padding:4px;cursor:pointer;font-size:11px;overflow:hidden}
.day:hover{background:#eef2ff}.day.other{opacity:.35}.day.today{border:2px solid #f59e0b}.day.sel{background:#dbeafe}
.dot{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;color:#fff;line-height:1.25;word-break:break-word}
.ev{background:#2563eb}.tk{background:#059669}.done{opacity:.5;text-decoration:line-through}
.wk{display:flex;flex-direction:column;gap:8px}
.wd{border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;cursor:pointer}.wd.today{border:2px solid #f59e0b}.wd.sel{background:#f0f5ff}
.wd h3{margin:0 0 4px;font-size:13px;color:#374151}.wd .none{font-size:12px;color:#9ca3af}
.it{border-left:4px solid #2563eb;background:#f8fafc;border-radius:6px;padding:6px 8px;margin-top:5px}
.it.tk{border-left-color:#059669;background:#f6fdf9;color:inherit}.it .ti{font-size:14px;font-weight:600;line-height:1.3}
.it .tm{font-size:12px;color:#6b7280;margin-right:6px;font-weight:500}.it .more{font-size:11px;color:#2563eb}
.it .dt{display:none;font-size:13px;color:#374151;margin-top:5px;white-space:pre-wrap;line-height:1.4}.it.open .dt{display:block}.it.open .more{display:none}
form{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
input,select,textarea{padding:6px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit}input[type=text]{flex:1;min-width:140px}textarea{width:100%;min-height:38px}
.side{display:flex;flex-direction:column;gap:16px}.empty{color:#9ca3af;font-size:13px;padding:6px}
.row{display:flex;align-items:center;gap:6px}.row .x{margin-left:auto;cursor:pointer;color:#dc2626;border:0;background:none;font-size:18px}
</style></head><body>
<header><h1>📅 My Calendar</h1><div id="today"></div></header>
<main>
<section class="card">
<div class="nav"><button onclick="mv(-1)">‹</button><h2 id="mt" style="margin:0"></h2><button onclick="mv(1)">›</button></div>
<div class="tabs" style="margin-bottom:10px"><button id="vw" onclick="setV('week')">Week</button><button id="vm" class="on" onclick="setV('month')">Month</button><button onclick="goToday()">Today</button></div>
<div id="view"></div>
<p style="font-size:12px;color:#6b7280">Tap a day to see its items; tap an item to see its full details. <span class="dot ev" style="display:inline">Event</span> <span class="dot tk" style="display:inline">Task</span></p></section>
<div class="side">
<section class="card"><h2 id="dt">Selected day</h2>
<form onsubmit="add(event)"><select id="ty"><option value="task">Task</option><option value="event">Event</option></select>
<input type="text" id="nm" placeholder="Title" required><input type="time" id="tm"><input type="date" id="dd"><textarea id="ds" placeholder="Details (optional)"></textarea><button class="p">Add</button></form>
<div id="dl"></div></section>
<section class="card"><h2>Review</h2><div class="tabs"><button id="b1" class="on" onclick="tab('up')">Next 7 days</button><button id="b2" onclick="tab('open')">Open tasks</button><button id="b3" onclick="tab('late')">Overdue</button></div><div id="rl" style="margin-top:8px"></div></section>
</div></main>
<script>
const K='myCal',KD='myCalDone',KH='myCalHidden';
let mine=JSON.parse(localStorage.getItem(K)||'[]'),doneS=new Set(JSON.parse(localStorage.getItem(KD)||'[]')),hid=new Set(JSON.parse(localStorage.getItem(KH)||'[]')),shared=[];
const loc=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sel=loc(new Date()),cur=new Date(),v='month',rt='up';
const all=()=>[...shared,...mine].filter(i=>!hid.has(String(i.id))).map(i=>({...i,done:doneS.has(String(i.id))}));
const sort=a=>a.sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
const save=()=>{localStorage.setItem(K,JSON.stringify(mine));localStorage.setItem(KD,JSON.stringify([...doneS]));localStorage.setItem(KH,JSON.stringify([...hid]));render()};
function setV(x){v=x;vw.classList.toggle('on',x=='week');vm.classList.toggle('on',x=='month');render()}
function goToday(){sel=loc(new Date());cur=new Date();dd.value=sel;render()}
function mv(n){if(v=='week')cur.setDate(cur.getDate()+7*n);else{cur.setDate(1);cur.setMonth(cur.getMonth()+n)}render()}
function pick(d){sel=d;dd.value=d;render();if(innerWidth<850)dt.scrollIntoView({behavior:'smooth'})}
function add(e){e.preventDefault();mine.push({id:'m'+Date.now(),type:ty.value,name:nm.value.trim(),time:tm.value,date:dd.value||sel,details:ds.value.trim()});nm.value='';tm.value='';ds.value='';save()}
function tog(id){id=String(id);doneS.has(id)?doneS.delete(id):doneS.add(id);save()}
function del(id){if(!confirm('Remove this item?'))return;id=String(id);mine=mine.filter(x=>String(x.id)!=id);hid.add(id);save()}
function tab(t){rt=t;['b1','b2','b3'].forEach((b,i)=>document.getElementById(b).classList.toggle('on',['up','open','late'][i]==t));render()}
function card(i,opt={}){const c=i.type=='task'?'tk':'ev';return `<div class="it ${c} ${i.done?'done':''}" onclick="event.stopPropagation();this.classList.toggle('open')">
<div class="row">${i.type=='task'?`<input type=checkbox ${i.done?'checked':''} onclick="event.stopPropagation()" onchange="tog('${i.id}')">`:''}<div class="ti">${opt.date?`<span class="tm">${i.date}</span>`:''}${i.time?`<span class="tm">${i.time}</span>`:''}${esc(i.name)}</div>${opt.del?`<button class="x" onclick="event.stopPropagation();del('${i.id}')">×</button>`:''}</div>
${i.details?`<div class="more">Tap for details ▾</div><div class="dt">${esc(i.details)}</div>`:''}</div>`}
function render(){const t=loc(new Date()),A=all();today.textContent=new Date().toDateString();let h='';
if(v=='week'){const s=new Date(cur);const e=new Date(s);e.setDate(e.getDate()+6);
mt.textContent=s.toLocaleDateString('en',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'});
h='<div class="wk">';for(let k=0;k<7;k++){const d=new Date(s);d.setDate(s.getDate()+k);const dsx=loc(d);const its=sort(A.filter(i=>i.date==dsx));
h+=`<div class="wd ${dsx==t?'today':''} ${dsx==sel?'sel':''}" onclick="pick('${dsx}')"><h3>${d.toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'})}${dsx==t?' · Today':''}</h3>${its.length?its.map(i=>card(i)).join(''):'<div class="none">Free</div>'}</div>`}h+='</div>'}
else{const m=new Date(cur.getFullYear(),cur.getMonth(),1);mt.textContent=m.toLocaleString('en',{month:'long',year:'numeric'});
h='<div class="grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class=dow>${d}</div>`).join('');const s=new Date(m);s.setDate(1-m.getDay());
for(let k=0;k<42;k++){const d=new Date(s);d.setDate(s.getDate()+k);const dsx=loc(d);const its=sort(A.filter(i=>i.date==dsx));
h+=`<div class="day ${d.getMonth()!=m.getMonth()?'other':''} ${dsx==t?'today':''} ${dsx==sel?'sel':''}" onclick="pick('${dsx}')"><b>${d.getDate()}</b>${its.slice(0,3).map(i=>`<span class="dot ${i.type=='task'?'tk':'ev'} ${i.done?'done':''}">${esc(i.name)}</span>`).join('')}${its.length>3?`<small>+${its.length-3}</small>`:''}</div>`}h+='</div>'}
view.innerHTML=h;dt.textContent=new Date(sel+'T00:00').toDateString();if(!dd.value)dd.value=sel;
const di=sort(A.filter(i=>i.date==sel));dl.innerHTML=di.length?di.map(i=>card(i,{del:1})).join(''):'<div class=empty>Nothing planned. Add a task or event above.</div>';
const w=new Date();w.setDate(w.getDate()+7);const we=loc(w);let r;
if(rt=='up')r=A.filter(i=>i.date>=t&&i.date<=we&&!i.done);else if(rt=='open')r=A.filter(i=>i.type=='task'&&!i.done);else r=A.filter(i=>i.type=='task'&&!i.done&&i.date<t);
r=sort(r);rl.innerHTML=r.length?r.map(i=>card(i,{date:1})).join(''):'<div class=empty>All clear.</div>'}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
fetch('events.json?'+Date.now()).then(r=>r.json()).then(j=>{shared=j;render()}).catch(()=>{});
</script></body></html>
